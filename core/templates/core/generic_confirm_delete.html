{% extends 'base.html' %}


{% block title %}Confirm Delete{% endblock %}


{% block content %}


<div class="container mt-5 pt-4">


    <div class="card shadow-sm mx-auto border-0" style="max-width: 450px; border-radius: 12px;">


        <div class="card-body text-center p-5">


            <i class="bi bi-exclamation-circle text-danger mb-3" style="font-size: 3rem;"></i>


            <h4 class="fw-bold mb-3">Delete Record</h4>


            <p class="text-muted mb-4">Are you sure you want to permanently delete this record? This action cannot be undone and balances will be recalculated.</p>


            <form method="post">


                {% csrf_token %}


                <div class="d-grid gap-2">


                    <button type="submit" class="btn btn-danger fw-bold py-2">Yes, Delete Record</button>


                    <a href="javascript:history.back()" class="btn btn-light fw-bold py-2 text-muted">Cancel</a>


                </div>


            </form>


        </div>


    </div>


</div>


{% endblock %}
