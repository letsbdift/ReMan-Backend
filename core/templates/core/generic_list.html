{% extends 'base.html' %}
{% block title %}Directory | RE Manager{% endblock %}
{% block content %}
<div class="d-flex justify-content-between pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Directory</h1>
    <a href="add/" class="btn btn-primary">Add New</a>
</div>
<ul class="list-group shadow-sm mt-3">
    {% for obj in objects %}
    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
        <span class="fw-bold">{{ obj }}</span>
        <a href="{{ obj.id }}/edit/" class="btn btn-sm btn-outline-secondary">Edit</a>
    </li>
    {% empty %}
    <li class="list-group-item text-center text-muted py-4">No items found.</li>
    {% endfor %}
</ul>
{% endblock %}
